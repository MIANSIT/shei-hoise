# Dev-only overlay on top of docker-compose.yml — adds a local MinIO
# container standing in for Cloudflare R2, and points `storage` at it.
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env <cmd>
# (docker/scripts/*.sh do this for you when run without an argument, or with "dev".)

services:

  minio:
    container_name: shei-hoise-minio
    image: cgr.dev/chainguard/minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server --console-address ":9001" /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 10s
      retries: 5
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-createbucket:
    container_name: shei-hoise-minio-createbucket
    image: cgr.dev/chainguard/minio-client:latest-dev
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -ec "
      mc alias set supa-minio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing supa-minio/${GLOBAL_S3_BUCKET}
      "

  storage:
    depends_on:
      minio-createbucket:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

volumes:
  minio-data:
