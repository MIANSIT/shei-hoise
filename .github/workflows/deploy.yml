name: Deploy to VPS

# On push to main: SSH to the VPS, pull the latest code, stop the currently
# running app container, then rebuild and start it with the new image.
#
# This only touches the `app` service — db, auth, storage, kong, caddy, and
# docker/.env.prod are never touched by this workflow. See
# docker/VPS_DEPLOYMENT.md for those manual, one-time steps.
#
# Note: there's a brief window of downtime between stopping the old
# container and the new one becoming healthy — this is a simple
# stop-then-start deploy, not a zero-downtime blue/green swap.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull latest code and redeploy app
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            cd "${{ secrets.VPS_DEPLOY_PATH }}"

            COMPOSE_FILES="-f docker/docker-compose.yml"
            [ "${{ vars.USE_PROXY }}" = "true" ] && COMPOSE_FILES="$COMPOSE_FILES -f docker/docker-compose.proxy.yml"

            echo "==> Pulling latest main"
            git pull origin main

            echo "==> Stopping current app container"
            docker compose $COMPOSE_FILES --env-file docker/.env.prod stop app

            echo "==> Building and starting new app container"
            docker compose $COMPOSE_FILES --env-file docker/.env.prod up -d --build app

            echo "==> Waiting for app to become healthy"
            attempt=0
            max_attempts=30
            until [ "$(docker inspect -f "{{.State.Health.Status}}" shei-hoise-app 2>/dev/null)" = "healthy" ]; do
              attempt=$((attempt+1))
              if [ $attempt -ge $max_attempts ]; then
                echo "✗ App did not become healthy within 60 seconds"
                docker logs shei-hoise-app | tail -50
                exit 1
              fi
              sleep 2
            done

            echo "✓ Deployed successfully"
          '